# The ONLY workflow file. Swati moves it once to .github/workflows/reels.yml.
# All logic lives in ci/ (which Claude can update), so this file never needs editing again.
name: Reels
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["reels/**", "references/**", "selftest/**", "ci/**", "engine/**"]
  workflow_dispatch:
    inputs:
      job:
        description: "prepare | preview | final | references | selftest | all"
        required: true
        default: all
      target:
        description: "reel slug or reference name (optional)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: reels
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/reel_engine
            ~/.cache/hyperframes
            ~/.cache/puppeteer
            ~/.npm
          key: reels-v2-${{ hashFiles('ci/config.env') }}-${{ github.run_id }}
          restore-keys: reels-v2-
      - name: Run pending jobs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_TARGET: ${{ inputs.target }}
          BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: bash ci/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: _out/
          if-no-files-found: ignore
          retention-days: 7
