# Reel pipeline. Lives at .github/workflows/reel.yml (Swati moves it there once; apps can't create workflow files).
#  - prepare : a release is published (tag = reel slug, raw video attached) -> transcript + checks committed to reels/<slug>/
#  - render  : Claude pushes reels/<slug>/plan.json -> final_reel.mp4, cover.jpg, caption.txt attached to the release
#  - selftest: selftest/run.txt changes -> synthetic end-to-end run, results in selftest/
name: Reels
on:
  release:
    types: [published]
  push:
    paths: ["reels/*/plan.json", "selftest/run.txt"]
  workflow_dispatch:
    inputs:
      job: {description: "prepare, render or selftest", required: true, default: selftest}
      tag: {description: "Reel slug (release tag) for prepare/render", required: false}
permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.r.outputs.mode }}
      tag: ${{ steps.r.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: r
        run: |
          EV="${{ github.event_name }}"; MODE=none; TAG=""
          if [ "$EV" = "release" ]; then MODE=prepare; TAG="${{ github.event.release.tag_name }}"
          elif [ "$EV" = "workflow_dispatch" ]; then MODE="${{ inputs.job }}"; TAG="${{ inputs.tag }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="HEAD~1"; fi
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            PLAN=$(echo "$CHANGED" | grep -E '^reels/[^/]+/plan\.json$' | head -1 || true)
            if [ -n "$PLAN" ]; then MODE=render; TAG=$(echo "$PLAN" | cut -d/ -f2)
            elif echo "$CHANGED" | grep -q '^selftest/run.txt$'; then MODE=selftest; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE  Reel: $TAG"

  prepare:
    needs: route
    if: needs.route.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: {group: "reel-${{ needs.route.outputs.tag }}", cancel-in-progress: false}
    env:
      TAG: ${{ needs.route.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.repository.default_branch }}
      WHISPER_MODEL: medium.en
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.repository.default_branch }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r engine/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache
          key: reel-cache-v1-${{ env.WHISPER_MODEL }}
      - name: Download raw video from the release
        run: |
          mkdir -p in
          gh release download "$TAG" -D in --clobber
          ls -la in
      - name: Transcribe and check
        run: |
          set -o pipefail
          RAW=$(python -m engine.reel pick-input in)
          echo "Using $RAW"
          GL=""; [ -f reels/glossary.txt ] && GL="--glossary reels/glossary.txt"
          python -m engine.reel prepare --video "$RAW" --out "reels/$TAG" $GL 2>&1 | tee log.txt
      - name: Save results
        if: always()
        run: |
          python ci/status.py "reels/$TAG" prepare "${{ job.status == 'success' }}" log.txt \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          bash ci/commit.sh "reels/$TAG" "prepare: $TAG"

  render:
    needs: route
    if: needs.route.outputs.mode == 'render'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency: {group: "reel-${{ needs.route.outputs.tag }}", cancel-in-progress: false}
    env:
      TAG: ${{ needs.route.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.repository.default_branch }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow
      - uses: actions/cache@v4
        with:
          path: ~/.cache/reel_engine
          key: reel-fonts-v1
      - uses: actions/cache@v4
        with:
          path: _work/${{ needs.route.outputs.tag }}/proxy.*
          key: proxy-${{ needs.route.outputs.tag }}-${{ github.run_id }}
          restore-keys: proxy-${{ needs.route.outputs.tag }}-
      - name: Download raw video
        run: |
          mkdir -p in
          gh release download "$TAG" -D in --clobber -p '*.mp4' -p '*.MP4' -p '*.mov' -p '*.MOV' -p '*.m4v' -p '*.mkv'
      - name: Render
        run: |
          set -o pipefail
          RAW=$(python -m engine.reel pick-input in)
          python -m engine.reel render --video "$RAW" --plan "reels/$TAG/plan.json" --out out --work "_work/$TAG" 2>&1 | tee log.txt
      - name: Attach to release
        run: |
          gh release upload "$TAG" out/final_reel.mp4 out/cover.jpg --clobber
          [ -f out/caption.txt ] && gh release upload "$TAG" out/caption.txt --clobber || true
          mkdir -p "reels/$TAG/review"
          cp out/sheet.jpg out/cover.jpg out/render_info.json "reels/$TAG/review/"
          [ -f out/caption.txt ] && cp out/caption.txt "reels/$TAG/review/" || true
      - name: Save status
        if: always()
        run: |
          python ci/status.py "reels/$TAG" render "${{ job.status == 'success' }}" log.txt \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          bash ci/commit.sh "reels/$TAG" "render: $TAG"

  selftest:
    needs: route
    if: needs.route.outputs.mode == 'selftest'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
      WHISPER_MODEL: small.en
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.repository.default_branch }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null
          pip install -q -r engine/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache
          key: reel-cache-v1-selftest
      - name: Run self-test
        run: |
          set -o pipefail
          python -m engine.reel selftest --out _st 2>&1 | tee log.txt
      - name: Save results
        if: always()
        run: |
          mkdir -p selftest
          if [ -f _st/result.json ]; then cp _st/result.json selftest/; else
            python -c "import json;json.dump({'ok':False,'log_tail':open('log.txt').read()[-4000:]},open('selftest/result.json','w'),indent=2)"; fi
          [ -f _st/storyboard.jpg ] && cp _st/storyboard.jpg selftest/ || true
          [ -f _st/render/sheet.jpg ] && cp _st/render/sheet.jpg selftest/ || true
          [ -f _st/render/cover.jpg ] && cp _st/render/cover.jpg selftest/ || true
          bash ci/commit.sh selftest "self-test result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-reel
          path: _st/render/final_reel.mp4
          if-no-files-found: ignore
          retention-days: 7
