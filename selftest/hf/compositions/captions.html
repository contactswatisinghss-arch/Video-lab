<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }
    #cap-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    .cap-group { position: absolute; left: 0; width: 1080px; top: 1190px; text-align: center; overflow: visible; }
    .cap-line { display: inline-block; font-family: 'Inter', sans-serif; font-weight: 900; color: #F2F4F7; line-height: 1.05;
      letter-spacing: -.01em; text-shadow: 0 4px 18px rgba(7,10,18,.75), 0 2px 4px rgba(7,10,18,.6); padding: 0 40px; }
    .cap-word { display: inline-block; position: relative; transform-origin: 50% 70%; }
    .cap-word .cap-txt { position: relative; z-index: 1; }
    /* threat / fix words get a coloured slab behind them */
    .cap-word.em-red::before, .cap-word.em-green::before { content: ""; position: absolute; left: -12px; right: -12px; top: 6%; bottom: 2%;
      border-radius: 14px; z-index: 0; }
    .cap-word.em-red::before { background: #FF3B4E; }
    .cap-word.em-green::before { background: #2EE59D; }
    .cap-word.em-green .cap-txt { color: #070A12; text-shadow: none; }
    .cap-word.em-red .cap-txt { text-shadow: none; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
    <div id="cap-stage"></div>
  </div>
  <script>
    {{lib:captions}}
    (function () {
      const tl = gsap.timeline({ paused: true });
      HFCaps.build({
        tl, container: "#cap-stage", words: {{words}},
        maxWords: 3, maxChars: 20, pauseBreak: 0.28, hold: 0.4,
        emphasis: { "em-red": ["Black October", "70%", "exposed", "down", "leaked"], "em-green": ["patched", "update PHP"] },
        font: { family: "Inter", weight: 900, size: 92, min: 56, maxWidth: 940 },
        // each word punches up as it is spoken; emphasised words land a touch bigger
        word(tl, span, w, grp, i) {
          const big = span.classList.contains("em-red") || span.classList.contains("em-green");
          tl.fromTo(span, { opacity: 0, scale: 0.6, y: 18 },
            { opacity: 1, scale: big ? 1.08 : 1, y: 0, duration: 0.18, ease: "back.out(2.2)" }, Math.max(grp.start, w.start - 0.04));
        },
        exit(tl, g, grp) { tl.to(g, { opacity: 0, duration: 0.09, ease: "power2.in" }, grp.end - 0.09); },
      });
      window.__timelines["captions"] = tl;
    })();
  </script>
</template>
