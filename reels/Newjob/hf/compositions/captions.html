<template>
<style>
  #root { position: absolute; inset: 0; pointer-events: none; }
  /* below her chin; each line on a tangerine tab, the spoken word underlined in cream (new caption look for this Reel) */
  #nc-stage { position: absolute; left: 50px; right: 50px; top: 1455px; height: 140px; }
  .cap-group { position: absolute; left: 0; right: 0; top: 0; text-align: center; }
  .cap-line { display: inline-block; padding: 8px 18px 12px; border-radius: 16px; background: #FF8A3D; font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800; color: #10201F; line-height: 1.1; letter-spacing: -.01em; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
  .cap-word { display: inline-block; position: relative; }
  .cap-word .cap-txt { position: relative; z-index: 1; }
  .cap-word .nc-u { position: absolute; left: 0; right: 0; bottom: -2px; height: 7px; border-radius: 4px; background: #10201F; transform-origin: 0 50%; transform: scaleX(0); }
</style>
<div id="root" data-composition-id="captions" data-width="1080" data-height="1920"><div id="nc-stage"></div></div>
<script>
(function () {
  {{lib:captions}}
  const tl = gsap.timeline({ paused: true });
  HFCaps.build({
    tl, container: "#nc-stage", words: {{words}}, idPrefix: "ncap",
    maxWords: 3, maxChars: 20, pauseBreak: 0.28, hold: 0.3,
    font: { family: "Bricolage Grotesque", weight: 800, size: 70, min: 46, maxWidth: 940 },
    enter(tl, g, spans, grp) {
      spans.forEach(s => { const u = document.createElement("span"); u.className = "nc-u"; s.appendChild(u); });
      tl.fromTo(g, { opacity: 0, rotation: -2, y: 14 }, { opacity: 1, rotation: 0, y: 0, duration: 0.16, ease: "back.out(2)" }, grp.start);
    },
    word(tl, span, w, grp, i) {
      const u = span.querySelector(".nc-u");
      tl.fromTo(u, { scaleX: 0 }, { scaleX: 1, duration: 0.1, ease: "power2.out" }, Math.max(grp.start, w.start - 0.02));
      tl.to(u, { scaleX: 0, duration: 0.08 }, w.end + 0.02);
    },
    exit(tl, g, grp) { tl.to(g, { opacity: 0, duration: 0.08, ease: "power2.in" }, grp.end - 0.08); }
  });
  window.__timelines["captions"] = tl;
})();
</script>
</template>
