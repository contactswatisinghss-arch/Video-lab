<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    {{fontfaces}}
    html, body { margin: 0; background: #000; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0A0C11; }
    #cam { position: absolute; inset: 0; transform-origin: 50% 42%; }
    #base { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    /* room set dressing (same as Part 1 so the series matches): an original warm neon "</>" sign on a dark plate, wall to her right */
    #neon { position: absolute; left: 846px; top: 800px; font: 700 66px 'JetBrains Mono', monospace; color: #FFE7A3;
      text-shadow: 0 0 6px #FFD15C, 0 0 18px #F3BA2F, 0 0 42px rgba(243,186,47,.75); letter-spacing: -.04em; opacity: .95;
      padding: 6px 22px 10px; border-radius: 16px; background: rgba(14,11,9,.88); box-shadow: 0 0 0 2px rgba(255,209,92,.18), 0 10px 30px rgba(0,0,0,.35); }
    #floor { position: absolute; left: 0; bottom: 0; width: 1080px; height: 260px;
      background: linear-gradient(180deg, rgba(10,12,17,0), rgba(10,12,17,.85)); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <!-- Binance heist part 2: same look as Part 1 (dark slate panels in the top band), ice blue = frozen. -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="{{dur}}"
       data-width="1080" data-height="1920" data-fps="30">

    <div id="cam" style="z-index:1">
      <video id="base" src="assets/base.mp4" data-start="0" data-duration="{{dur}}" data-track-index="0" data-has-audio="true" playsinline></video>
      <div id="neon" data-layout-ignore data-layout-allow-occlusion>&lt;/&gt;</div>
    </div>
    <div id="floor" style="z-index:2"></div>

    <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
         data-start="0" data-duration="{{= at(w25) - 0.04 }}" data-track-index="1" data-track-kind="graphics" style="z-index:3"></div>
    <div id="why" data-composition-id="why" data-composition-src="compositions/why.html"
         data-start="{{at:w25-0.04}}" data-duration="{{= at(w48) - at(w25) }}" data-track-index="2" data-track-kind="graphics" style="z-index:3"></div>
    <div id="bank" data-composition-id="bank" data-composition-src="compositions/bank.html"
         data-start="{{at:w48-0.04}}" data-duration="{{= at(w71) - at(w48) }}" data-track-index="3" data-track-kind="graphics" style="z-index:3"></div>
    <div id="satoshi" data-composition-id="satoshi" data-composition-src="compositions/satoshi.html"
         data-start="{{at:w71-0.04}}" data-duration="{{= at(w94) - at(w71) }}" data-track-index="4" data-track-kind="graphics" style="z-index:3"></div>
    <div id="chain" data-composition-id="chain" data-composition-src="compositions/chain.html"
         data-start="{{at:w94-0.04}}" data-duration="{{= at(w119) - at(w94) }}" data-track-index="5" data-track-kind="graphics" style="z-index:3"></div>
    <div id="question" data-composition-id="question" data-composition-src="compositions/question.html"
         data-start="{{at:w119-0.04}}" data-duration="{{= at(w132) - at(w119) }}" data-track-index="6" data-track-kind="graphics" style="z-index:3"></div>
    <div id="stable" data-composition-id="stable" data-composition-src="compositions/stable.html"
         data-start="{{at:w132-0.04}}" data-duration="{{= at(w168) - at(w132) }}" data-track-index="7" data-track-kind="graphics" style="z-index:3"></div>
    <div id="nobutton" data-composition-id="nobutton" data-composition-src="compositions/nobutton.html"
         data-start="{{at:w168-0.04}}" data-duration="{{= at(w185) - at(w168) }}" data-track-index="8" data-track-kind="graphics" style="z-index:3"></div>
    <div id="short" data-composition-id="short" data-composition-src="compositions/short.html"
         data-start="{{at:w185-0.04}}" data-duration="{{= at(w240) - at(w185) }}" data-track-index="9" data-track-kind="graphics" style="z-index:3"></div>
    <div id="target" data-composition-id="target" data-composition-src="compositions/target.html"
         data-start="{{at:w240-0.04}}" data-duration="{{= at(w265) - at(w240) }}" data-track-index="10" data-track-kind="graphics" style="z-index:3"></div>
    <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
         data-start="{{at:w265-0.04}}" data-duration="{{= dur - at(w265) + 0.04 }}" data-track-index="11" data-track-kind="graphics" style="z-index:3"></div>

    <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
         data-start="0" data-duration="{{dur}}" data-track-index="12" data-track-kind="captions" style="z-index:5"></div>
  </div>

  <script>
    // Camera: lift her 110 px so the wall above her head is free for graphics; punch-ins on the hook, the question and the turns.
    const tl = gsap.timeline({ paused: true });
    tl.set("#cam", { y: -110, scale: 1.06 }, 0)
      .set("#cam", { scale: 1.10 }, {{at:w3}})
      .set("#cam", { scale: 1.00 }, {{at:w7}})
      .set("#cam", { scale: 1.08 }, {{at:w19}})
      .set("#cam", { scale: 1.00 }, {{at:w25}})
      .set("#cam", { scale: 1.10 }, {{at:w31}})
      .set("#cam", { scale: 1.00 }, {{at:w34}})
      .set("#cam", { scale: 1.10 }, {{at:w66}})
      .set("#cam", { scale: 1.00 }, {{at:w71}})
      .set("#cam", { scale: 1.08 }, {{at:w111}})
      .set("#cam", { scale: 1.00 }, {{at:w119}})
      .set("#cam", { scale: 1.12 }, {{at:w122}})
      .set("#cam", { scale: 1.00 }, {{at:w126}})
      .set("#cam", { scale: 1.10 }, {{at:w158}})
      .set("#cam", { scale: 1.00 }, {{at:w163}})
      .set("#cam", { scale: 1.08 }, {{at:w188}})
      .set("#cam", { scale: 1.00 }, {{at:w194}})
      .set("#cam", { scale: 1.10 }, {{at:w233}})
      .set("#cam", { scale: 1.00 }, {{at:w240}})
      .set("#cam", { scale: 1.10 }, {{at:w256}})
      .set("#cam", { scale: 1.00 }, {{at:w265}})
      .set("#cam", { scale: 1.08 }, {{at:w276}});
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
