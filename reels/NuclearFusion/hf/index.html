<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    {{fontfaces}}
    html, body { margin: 0; background: #000; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #05030C; }
    /* space layer: only visible where the footage is cropped into the portal (cover, plasma, end) */
    #space { position: absolute; inset: 0;
      background: radial-gradient(120% 70% at 50% 100%, #3A0F05 0%, #12040A 45%, #05030C 75%); }
    #stars { position: absolute; inset: 0;
      background-image: radial-gradient(2px 2px at 120px 300px, #fff8, transparent), radial-gradient(2px 2px at 860px 220px, #fff9, transparent),
        radial-gradient(1.5px 1.5px at 400px 160px, #fff7, transparent), radial-gradient(2px 2px at 960px 640px, #fff6, transparent),
        radial-gradient(1.5px 1.5px at 70px 820px, #fff6, transparent), radial-gradient(1.5px 1.5px at 640px 90px, #fff8, transparent),
        radial-gradient(1.5px 1.5px at 260px 1200px, #fff6, transparent), radial-gradient(2px 2px at 1000px 1100px, #fff7, transparent); }
    #bigsun { position: absolute; left: 540px; top: 2050px; width: 2200px; height: 2200px; margin-left: -1100px; margin-top: -1100px;
      border-radius: 50%; background: radial-gradient(circle, #FFF2B8 0%, #FFC23D 25%, #FF7A12 48%, #C2300A 62%, rgba(150,20,5,0) 70%); }
    #torus-back, #torus { position: absolute; left: 40px; top: 1500px; width: 1000px; height: 260px; border-radius: 50%;
      box-sizing: border-box; opacity: 1; }
    #torus-back { border: 16px solid rgba(217,166,255,.35); clip-path: inset(0 0 55% 0); }
    #torus { border: 16px solid #D9A6FF; box-shadow: 0 0 40px 8px #A04DFF, inset 0 0 40px 8px #A04DFF; clip-path: inset(45% 0 0 0); }
    #cam { position: absolute; inset: 0; transform-origin: 50% 42%; clip-path: inset(640px 150px 260px 150px round 390px); }
    /* the footage is never graded, filtered, tinted or blended (Swati's hard rule) */
    #base { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <!-- NuclearFusion: look A+C. C = space takeovers + portal with a tokamak ring; A = solar-glass cards over her real room. -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="{{dur}}"
       data-width="1080" data-height="1920" data-fps="30">

    <div id="space" style="z-index:0"><div id="stars"></div><div id="bigsun"></div></div>
    <div id="torus-back" style="z-index:1"></div>

    <div id="cam" style="z-index:2">
      <video id="base" src="assets/base.mp4" data-start="0" data-duration="{{dur}}" data-track-index="0" data-has-audio="true" playsinline></video>
    </div>
    <div id="torus" style="z-index:3"></div>

    <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
         data-start="0" data-duration="{{= at(w52) }}" data-track-index="1" data-track-kind="graphics" style="z-index:4"></div>
    <div id="series" data-composition-id="series" data-composition-src="compositions/series.html"
         data-start="{{= at(w52) }}" data-duration="{{= at(w79) - at(w52) }}" data-track-index="2" data-track-kind="graphics" style="z-index:4"></div>
    <div id="ep" data-composition-id="ep" data-composition-src="compositions/ep.html"
         data-start="{{= at(w79) - 0.05 }}" data-duration="{{= at(w84) - at(w79) + 0.05 }}" data-track-index="3" data-track-kind="graphics" style="z-index:4"></div>
    <div id="sun" data-composition-id="sun" data-composition-src="compositions/sun.html"
         data-start="{{= at(w84) - 0.05 }}" data-duration="{{= at(w104) - at(w84) + 0.05 }}" data-track-index="4" data-track-kind="graphics" style="z-index:4"></div>
    <div id="grid" data-composition-id="grid" data-composition-src="compositions/grid.html"
         data-start="{{= at(w104) }}" data-duration="{{= at(w129) - at(w104) }}" data-track-index="5" data-track-kind="graphics" style="z-index:4"></div>
    <div id="burst" data-composition-id="burst" data-composition-src="compositions/burst.html"
         data-start="{{= at(w129) - 0.05 }}" data-duration="{{= at(w141) - at(w129) + 0.05 }}" data-track-index="6" data-track-kind="graphics" style="z-index:4"></div>
    <div id="repel" data-composition-id="repel" data-composition-src="compositions/repel.html"
         data-start="{{= at(w141) }}" data-duration="{{= at(w161) - at(w141) }}" data-track-index="7" data-track-kind="graphics" style="z-index:4"></div>
    <div id="heat" data-composition-id="heat" data-composition-src="compositions/heat.html"
         data-start="{{= at(w161) }}" data-duration="{{= at(w178) - at(w161) }}" data-track-index="8" data-track-kind="graphics" style="z-index:4"></div>
    <div id="plasma" data-composition-id="plasma" data-composition-src="compositions/plasma.html"
         data-start="{{= at(w178) }}" data-duration="{{= at(w205) - at(w178) }}" data-track-index="9" data-track-kind="graphics" style="z-index:4"></div>
    <div id="toka" data-composition-id="toka" data-composition-src="compositions/toka.html"
         data-start="{{= at(w205) }}" data-duration="{{= at(w244) - at(w205) }}" data-track-index="10" data-track-kind="graphics" style="z-index:4"></div>
    <div id="pac" data-composition-id="pac" data-composition-src="compositions/pac.html"
         data-start="{{= at(w244) }}" data-duration="{{= at(w265) - at(w244) }}" data-track-index="11" data-track-kind="graphics" style="z-index:4"></div>
    <div id="loop" data-composition-id="loop" data-composition-src="compositions/loop.html"
         data-start="{{= at(w265) }}" data-duration="{{= at(w297) - at(w265) }}" data-track-index="12" data-track-kind="graphics" style="z-index:4"></div>
    <div id="tested" data-composition-id="tested" data-composition-src="compositions/tested.html"
         data-start="{{= at(w297) }}" data-duration="{{= at(w304) - at(w297) }}" data-track-index="13" data-track-kind="graphics" style="z-index:4"></div>
    <div id="road" data-composition-id="road" data-composition-src="compositions/road.html"
         data-start="{{= at(w304) }}" data-duration="{{= at(w343) - at(w304) }}" data-track-index="14" data-track-kind="graphics" style="z-index:4"></div>
    <div id="close" data-composition-id="close" data-composition-src="compositions/close.html"
         data-start="{{= at(w343) }}" data-duration="{{= at(w369) - at(w343) }}" data-track-index="15" data-track-kind="graphics" style="z-index:4"></div>
    <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
         data-start="{{= at(w369) }}" data-duration="{{= dur - at(w369) }}" data-track-index="16" data-track-kind="graphics" style="z-index:4"></div>

    <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
         data-start="0" data-duration="{{dur}}" data-track-index="17" data-track-kind="captions" style="z-index:6"></div>
  </div>

  <script>
    // Camera + portal. Framing only: scale and crop, never colour.
    const P = "inset(640px 150px 260px 150px round 390px)";   // portal window (cover, plasma, end)
    const FULL = "inset(0px 0px 0px 0px round 0px)";
    const tl = gsap.timeline({ paused: true });
    // cover: she sits in the portal inside the tokamak ring, the sun rising behind
    tl.set("#cam", { clipPath: P, scale: 1.0 }, 0)
      .set(["#torus", "#torus-back"], { opacity: 1 }, 0)
      .fromTo("#bigsun", { y: 0 }, { y: -60, duration: 2.2, ease: "power2.out" }, 0)
      // "right here on earth": the portal opens to full frame
      .to("#cam", { clipPath: FULL, duration: 0.55, ease: "power3.inOut" }, {{at:w8}} - 0.1)
      .to(["#torus", "#torus-back"], { opacity: 0, duration: 0.3, ease: "power2.in" }, {{at:w8}} - 0.1)
      // punch-ins on the hook and turns
      .set("#cam", { scale: 1.1 }, {{at:w13}})
      .set("#cam", { scale: 1.0 }, {{at:w52}})
      .set("#cam", { scale: 1.08 }, {{at:w141}})
      .set("#cam", { scale: 1.0 }, {{at:w153}})
      // plasma: back into the portal, ring returns glowing
      .set("#cam", { clipPath: FULL, scale: 1.0 }, {{at:w178}} - 0.01)
      .to("#cam", { clipPath: P, duration: 0.5, ease: "power3.inOut" }, {{at:w178}})
      .to(["#torus", "#torus-back"], { opacity: 1, duration: 0.35, ease: "power2.out" }, {{at:w178}} + 0.2)
      .to("#cam", { clipPath: FULL, duration: 0.5, ease: "power3.inOut" }, {{at:w205}} - 0.25)
      .to(["#torus", "#torus-back"], { opacity: 0, duration: 0.25, ease: "power2.in" }, {{at:w205}} - 0.25)
      // instability: a short shake on "unstable" and "disrupt"
      .to("#cam", { keyframes: { x: [0, -14, 12, -9, 7, -4, 0] }, duration: 0.42, ease: "none" }, {{at:w230}})
      .to("#cam", { keyframes: { x: [0, 16, -12, 9, -6, 3, 0] }, duration: 0.42, ease: "none" }, {{at:w234}})
      .set("#cam", { scale: 1.08 }, {{at:w244}})
      .set("#cam", { scale: 1.0 }, {{at:w253}})
      .set("#cam", { scale: 1.06 }, {{at:w304}})
      .set("#cam", { scale: 1.0 }, {{at:w313}})
      .set("#cam", { scale: 1.12 }, {{at:w350}})
      .set("#cam", { scale: 1.0 }, {{at:w362}})
      // end: back into the portal for the series card
      .to("#cam", { clipPath: P, duration: 0.5, ease: "power3.inOut" }, {{at:w369}})
      .to(["#torus", "#torus-back"], { opacity: 1, duration: 0.35, ease: "power2.out" }, {{at:w369}} + 0.2);
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
