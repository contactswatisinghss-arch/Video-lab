<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    {{fontfaces}}
    html, body { margin: 0; background: #000; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
    #cam { position: absolute; inset: 0; }
    #base { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <!-- Promotion · "library & gold": ink #0E1726, ink-2 #16233A, gold #F5B83D, cream #FBF6EA, green #3DDC97 (do),
       red #FF5A5F (don't), steel #8DA2C0. Fraunces (display serif, echoes her library shelves), Inter Tight (UI), JetBrains Mono (code).
       Real library room as shot, no decor. Her hair top ~y 440, eyes ~860, chin ~1200: top-band cards stay in 170-420,
       captions sit under her chin (~1250). Four full-screen takeovers (hook, tickets->outcomes, design doc, AI editor + slam, recap).
       No camera moves (overlay on the 4K original). -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="{{dur}}" data-width="1080" data-height="1920" data-fps="30">
    <div id="cam" style="z-index:1"><video id="base" src="assets/base.mp4" data-start="0" data-duration="{{dur}}" data-track-index="0" data-has-audio="true" playsinline></video></div>
    <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="{{= at(w7) - 0.1 }}" data-track-index="1" data-track-kind="graphics" style="z-index:3"></div>
    <div id="cred" data-composition-id="cred" data-composition-src="compositions/cred.html" data-start="{{= at(w7) - 0.1 }}" data-duration="{{= at(w30) - at(w7) }}" data-track-index="2" data-track-kind="graphics" style="z-index:3"></div>
    <div id="five" data-composition-id="five" data-composition-src="compositions/five.html" data-start="{{= at(w30) - 0.1 }}" data-duration="{{= at(w41) - at(w30) }}" data-track-index="3" data-track-kind="graphics" style="z-index:3"></div>
    <div id="tipa" data-composition-id="tipa" data-composition-src="compositions/tipa.html" data-start="{{= at(w41) - 0.1 }}" data-duration="{{= at(w58) - at(w41) }}" data-track-index="4" data-track-kind="graphics" style="z-index:3"></div>
    <div id="tipb" data-composition-id="tipb" data-composition-src="compositions/tipb.html" data-start="{{= at(w58) - 0.1 }}" data-duration="{{= at(w75) - at(w58) }}" data-track-index="5" data-track-kind="graphics" style="z-index:3"></div>
    <div id="tipc" data-composition-id="tipc" data-composition-src="compositions/tipc.html" data-start="{{= at(w75) - 0.1 }}" data-duration="{{= at(w95) - at(w75) }}" data-track-index="6" data-track-kind="graphics" style="z-index:3"></div>
    <div id="tipd" data-composition-id="tipd" data-composition-src="compositions/tipd.html" data-start="{{= at(w95) - 0.1 }}" data-duration="{{= at(w119) - at(w95) }}" data-track-index="7" data-track-kind="graphics" style="z-index:3"></div>
    <div id="tipe" data-composition-id="tipe" data-composition-src="compositions/tipe.html" data-start="{{= at(w119) - 0.1 }}" data-duration="{{= at(w151) - at(w119) }}" data-track-index="8" data-track-kind="graphics" style="z-index:3"></div>
    <div id="diff" data-composition-id="diff" data-composition-src="compositions/diff.html" data-start="{{= at(w151) - 0.1 }}" data-duration="{{= at(w169) - at(w151) }}" data-track-index="9" data-track-kind="graphics" style="z-index:3"></div>
    <div id="recap" data-composition-id="recap" data-composition-src="compositions/recap.html" data-start="{{= at(w169) - 0.1 }}" data-duration="{{= dur - at(w169) + 0.1 }}" data-track-index="10" data-track-kind="graphics" style="z-index:3"></div>
    <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="{{dur}}" data-track-index="11" data-track-kind="captions" style="z-index:5"></div>
  </div>
  <script>const tl = gsap.timeline({ paused: true }); window.__timelines["main"] = tl;</script>
</body>
</html>
