<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    {{fontfaces}}
    html, body { margin: 0; background: #000; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
    #cam { position: absolute; inset: 0; }
    #base { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <!-- AITerms · "AI dictionary": paper #F4EFE3, ink #121212, electric blue #2D5BFF, highlighter #FFE14D, red #E5484D, green #22A447.
       Fraunces (dictionary headwords), Archivo (UI + captions), JetBrains Mono (labels/terminal).
       Her head ~y 540-1220 (bookshelf room, as shot, no decor). Top-band beats stay in 176-520; takeovers alternate with them. No camera moves. -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="{{dur}}" data-width="1080" data-height="1920" data-fps="30">
    <div id="cam" style="z-index:1"><video id="base" src="assets/base.mp4" data-start="0" data-duration="{{dur}}" data-track-index="0" data-has-audio="true" playsinline></video></div>
    <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="{{= at(w15) - 0.1 }}" data-track-index="1" data-track-kind="graphics" style="z-index:3"></div>
    <div id="d1" data-composition-id="d1" data-composition-src="compositions/d1.html" data-start="{{= at(w15) - 0.1 }}" data-duration="{{= at(w20) - at(w15) }}" data-track-index="2" data-track-kind="graphics" style="z-index:3"></div>
    <div id="ctx" data-composition-id="ctx" data-composition-src="compositions/ctx.html" data-start="{{= at(w20) - 0.1 }}" data-duration="{{= at(w49) - at(w20) }}" data-track-index="3" data-track-kind="graphics" style="z-index:3"></div>
    <div id="ctx2" data-composition-id="ctx2" data-composition-src="compositions/ctx2.html" data-start="{{= at(w49) - 0.1 }}" data-duration="{{= at(w61) - at(w49) }}" data-track-index="4" data-track-kind="graphics" style="z-index:3"></div>
    <div id="d2" data-composition-id="d2" data-composition-src="compositions/d2.html" data-start="{{= at(w61) - 0.1 }}" data-duration="{{= at(w65) - at(w61) }}" data-track-index="5" data-track-kind="graphics" style="z-index:3"></div>
    <div id="hrn" data-composition-id="hrn" data-composition-src="compositions/hrn.html" data-start="{{= at(w65) - 0.1 }}" data-duration="{{= at(w88) - at(w65) }}" data-track-index="6" data-track-kind="graphics" style="z-index:3"></div>
    <div id="hrn2" data-composition-id="hrn2" data-composition-src="compositions/hrn2.html" data-start="{{= at(w88) - 0.1 }}" data-duration="{{= at(w102) - at(w88) }}" data-track-index="7" data-track-kind="graphics" style="z-index:3"></div>
    <div id="d3" data-composition-id="d3" data-composition-src="compositions/d3.html" data-start="{{= at(w102) - 0.1 }}" data-duration="{{= at(w106) - at(w102) }}" data-track-index="8" data-track-kind="graphics" style="z-index:3"></div>
    <div id="ev1" data-composition-id="ev1" data-composition-src="compositions/ev1.html" data-start="{{= at(w106) - 0.1 }}" data-duration="{{= at(w121) - at(w106) }}" data-track-index="9" data-track-kind="graphics" style="z-index:3"></div>
    <div id="ev2" data-composition-id="ev2" data-composition-src="compositions/ev2.html" data-start="{{= at(w121) - 0.1 }}" data-duration="{{= at(w134) - at(w121) }}" data-track-index="10" data-track-kind="graphics" style="z-index:3"></div>
    <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="{{= at(w134) - 0.1 }}" data-duration="{{= at(w150) - at(w134) }}" data-track-index="11" data-track-kind="graphics" style="z-index:3"></div>
    <div id="endc" data-composition-id="endc" data-composition-src="compositions/endc.html" data-start="{{= at(w150) - 0.1 }}" data-duration="{{= dur - at(w150) + 0.1 }}" data-track-index="12" data-track-kind="graphics" style="z-index:3"></div>
    <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="{{dur}}" data-track-index="13" data-track-kind="captions" style="z-index:5"></div>
  </div>
  <script>const tl = gsap.timeline({ paused: true }); window.__timelines["main"] = tl;</script>
</body>
</html>
