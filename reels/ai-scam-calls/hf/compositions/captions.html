<template>
  <!-- Captions for this Reel: Inter Black on a soft shadow; amber slab = access/locked, red = attack, green = fix. -->
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }
    #cp-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    .cap-group { position: absolute; left: 0; width: 1080px; top: 1200px; text-align: center; overflow: visible; }
    .cap-line { display: inline-block; font-family: 'Inter', sans-serif; font-weight: 900; color: #FFFFFF; line-height: 1.05;
      letter-spacing: -.01em; text-shadow: 0 4px 20px rgba(0,0,0,.7), 0 2px 5px rgba(0,0,0,.65); padding: 0 40px; }
    .cap-word { display: inline-block; position: relative; transform-origin: 50% 70%; }
    .cap-word .cap-txt { position: relative; z-index: 1; }
    .cap-word.em-amber, .cap-word.em-red, .cap-word.em-green { margin: 0 12px; }
    .cap-word.em-amber::before, .cap-word.em-red::before, .cap-word.em-green::before { content: ""; position: absolute; left: -12px; right: -12px;
      top: 6%; bottom: 2%; border-radius: 14px; z-index: 0; }
    .cap-word.em-amber::before { background: #FFB547; }
    .cap-word.em-red::before { background: #FF4757; }
    .cap-word.em-green::before { background: #35E39A; }
    .cap-word.em-amber .cap-txt, .cap-word.em-green .cap-txt { color: #0A0B0E; text-shadow: none; }
    .cap-word.em-red .cap-txt { text-shadow: none; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
    <div id="cp-stage"></div>
  </div>
  <script>
    {{lib:captions}}
    (function () {
      const tl = gsap.timeline({ paused: true });
      const words = {{words}}.map(w => w.id === "w147" ? Object.assign({}, w, { text: "The" }) : w);
      HFCaps.build({
        tl, container: "#cp-stage", words, idPrefix: "cp",
        maxWords: 3, maxChars: 20, pauseBreak: 0.28, hold: 0.4,
        emphasis: { "em-amber": ["strongest", "access", "restricted"], "em-red": ["offenders", "exploited"], "em-green": ["patching", "fix"] },
        font: { family: "Inter", weight: 900, size: 90, min: 56, maxWidth: 940 },
        word(tl, span, w, grp, i) {
          const big = /em-/.test(span.className);
          tl.fromTo(span, { opacity: 0, scale: 0.6, y: 18 },
            { opacity: 1, scale: big ? 1.08 : 1, y: 0, duration: 0.18, ease: "back.out(2.2)" }, Math.max(grp.start, w.start - 0.04));
        },
        exit(tl, g, grp) { tl.to(g, { opacity: 0, duration: 0.09, ease: "power2.in" }, grp.end - 0.09); },
      });
      window.__timelines["captions"] = tl;
    })();
  </script>
</template>
