<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    {{fontfaces}}
    html, body { margin: 0; background: #000; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0A0B0E; }
    #cam { position: absolute; inset: 0; transform-origin: 50% 45%; }
    #base { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <!-- Gemini 4 Carbon: "Google's strongest AI, and you can't use it". Look: carbon-black glass, amber = locked/access,
       green = defenders/fix, red = attackers/exploit. Every scene is anchored to the words that cue it. -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="{{dur}}"
       data-width="1080" data-height="1920" data-fps="30">

    <div id="cam" style="z-index:1">
      <video id="base" src="assets/base.mp4" data-start="0" data-duration="{{dur}}" data-track-index="0" data-has-audio="true" playsinline></video>
    </div>

    <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
         data-start="0" data-duration="{{at:w31}}" data-track-index="1" data-track-kind="graphics" style="z-index:3"></div>

    <div id="carbon" data-composition-id="carbon" data-composition-src="compositions/carbon.html"
         data-start="{{at:w48-0.12}}" data-duration="{{= at(w82) - at(w48) + 0.02 }}" data-track-index="2" data-track-kind="graphics" style="z-index:3"></div>

    <div id="dual" data-composition-id="dual" data-composition-src="compositions/dual.html"
         data-start="{{at:w82-0.1}}" data-duration="{{= at(w108) - at(w82) + 0.1 }}" data-track-index="3" data-track-kind="graphics" style="z-index:3"></div>

    <div id="gate" data-composition-id="gate" data-composition-src="compositions/gate.html"
         data-start="{{at:w108}}" data-duration="{{= at(w147) - at(w108) }}" data-track-index="4" data-track-kind="graphics" style="z-index:3"></div>

    <div id="skills" data-composition-id="skills" data-composition-src="compositions/skills.html"
         data-start="{{at:w147}}" data-duration="{{= at(w193) - at(w147) }}" data-track-index="5" data-track-kind="graphics" style="z-index:3"></div>

    <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
         data-start="{{at:w193}}" data-duration="{{= dur - at(w193) }}" data-track-index="6" data-track-kind="graphics" style="z-index:3"></div>

    <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
         data-start="0" data-duration="{{dur}}" data-track-index="7" data-track-kind="captions" style="z-index:5"></div>
  </div>

  <script>
    // Camera: hard punch-ins on the hook, the questions and the turn; releases when a graphic needs the frame.
    const tl = gsap.timeline({ paused: true });
    tl.set("#cam", { scale: 1.10 }, 0)
      .set("#cam", { scale: 1.0 }, {{at:w7}})
      .set("#cam", { scale: 1.08 }, {{at:w15}})
      .set("#cam", { scale: 1.15 }, {{at:w31}})
      .set("#cam", { scale: 1.0 }, {{at:w48-0.12}})
      .set("#cam", { scale: 1.12 }, {{at:w105}})
      .set("#cam", { scale: 1.0 }, {{at:w108}})
      .set("#cam", { scale: 1.08 }, {{at:w122}})
      .set("#cam", { scale: 1.0 }, {{at:w127}})
      .set("#cam", { scale: 1.06 }, {{at:w163}})
      .set("#cam", { scale: 1.0 }, {{at:w174}})
      .set("#cam", { scale: 1.06 }, {{at:w187}})
      .set("#cam", { scale: 1.0 }, {{at:w193}})
      .set("#cam", { scale: 1.12 }, {{at:w200}});
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
