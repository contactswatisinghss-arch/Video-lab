<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    {{fontfaces}}
    html, body { margin: 0; background: #000; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0D0F14; }
    #cam { position: absolute; inset: 0; transform-origin: 50% 45%; }
    /* Original camera look (Swati, 9 Nov): no colour filter; edit.json "hdr": "original". */
    #base { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <!-- Anthropic v2 (Swati: v1 was monotonous, one dark top panel repeated). Every beat now uses a DIFFERENT device:
       kinetic number hook · red full-screen crash + shake · stickers then whip-pan card with Swati as picture-in-picture ·
       whip zoom + kinetic question · split-screen swipe carousel · full-screen cake build with PIP + pull-back reveal ·
       night skyline + counter · power-down blackout · kinetic list over her · quick-cut burst + slam · follow card.
       Scene hosts sit at z 2; #cam is raised to z 3 only while it is a picture-in-picture over a full-screen scene. -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="{{dur}}"
       data-width="1080" data-height="1920" data-fps="30">

    <div id="cam" style="z-index:0">
      <video id="base" src="assets/base.mp4" data-start="0" data-duration="{{dur}}" data-track-index="0" data-has-audio="true" playsinline></video>
    </div>

    <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
         data-start="0" data-duration="{{= at(w14) - 0.04 }}" data-track-index="1" data-track-kind="graphics" style="z-index:2"></div>
    <div id="crash" data-composition-id="crash" data-composition-src="compositions/crash.html"
         data-start="{{at:w14-0.04}}" data-duration="{{= at(w60) - at(w14) }}" data-track-index="2" data-track-kind="graphics" style="z-index:2"></div>
    <div id="spend" data-composition-id="spend" data-composition-src="compositions/spend.html"
         data-start="{{at:w60-0.04}}" data-duration="{{= at(w77) - at(w60) }}" data-track-index="3" data-track-kind="graphics" style="z-index:2"></div>
    <div id="why" data-composition-id="why" data-composition-src="compositions/why.html"
         data-start="{{at:w77-0.04}}" data-duration="{{= at(w89) - at(w77) }}" data-track-index="4" data-track-kind="graphics" style="z-index:2"></div>
    <div id="race" data-composition-id="race" data-composition-src="compositions/race.html"
         data-start="{{at:w89-0.04}}" data-duration="{{= at(w142) - at(w89) }}" data-track-index="5" data-track-kind="graphics" style="z-index:2"></div>
    <div id="cake" data-composition-id="cake" data-composition-src="compositions/cake.html"
         data-start="{{at:w142-0.04}}" data-duration="{{= at(w187) - at(w142) }}" data-track-index="6" data-track-kind="graphics" style="z-index:2"></div>
    <div id="deal" data-composition-id="deal" data-composition-src="compositions/deal.html"
         data-start="{{at:w187-0.04}}" data-duration="{{= at(w205) - at(w187) }}" data-track-index="7" data-track-kind="graphics" style="z-index:2"></div>
    <div id="runs" data-composition-id="runs" data-composition-src="compositions/runs.html"
         data-start="{{at:w205-0.04}}" data-duration="{{= at(w225) - at(w205) }}" data-track-index="8" data-track-kind="graphics" style="z-index:2"></div>
    <div id="phases" data-composition-id="phases" data-composition-src="compositions/phases.html"
         data-start="{{at:w225-0.04}}" data-duration="{{= at(w256) - at(w225) }}" data-track-index="9" data-track-kind="graphics" style="z-index:2"></div>
    <div id="battle" data-composition-id="battle" data-composition-src="compositions/battle.html"
         data-start="{{at:w256-0.04}}" data-duration="{{= at(w268) - at(w256) }}" data-track-index="10" data-track-kind="graphics" style="z-index:2"></div>
    <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
         data-start="{{at:w268-0.04}}" data-duration="{{= dur - at(w268) + 0.04 }}" data-track-index="11" data-track-kind="graphics" style="z-index:2"></div>

    <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
         data-start="0" data-duration="{{dur}}" data-track-index="12" data-track-kind="captions" style="z-index:5"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const FULL = "inset(0px 0px 0px 0px round 0px)";
    // PIP: crop a 760 px square around her face (centre ~540, 860), shrink it and park it low-left or low-right.
    const PIPCLIP = "inset(480px 160px 680px 160px round 380px)";
    const BASE = { x: 0, y: 0, scale: 1.06, clipPath: FULL, zIndex: 0 };
    const pipIn = (t, side) => {
      tl.set("#cam", { zIndex: 3 }, t);
      tl.to("#cam", { clipPath: PIPCLIP, scale: 0.4, x: side * 300, y: 640, duration: 0.42, ease: "expo.out" }, t);
    };
    const pipOut = (t) => {
      tl.to("#cam", { clipPath: FULL, scale: 1.06, x: 0, y: 0, duration: 0.36, ease: "power3.out" }, t);
      tl.set("#cam", { zIndex: 0 }, t + 0.36);
    };
    const punch = (t, s) => tl.set("#cam", { scale: s }, t);
    const shake = (t, amp) => tl.to("#cam", { keyframes: [
      { x: -amp, y: amp * 0.6, duration: 0.04 }, { x: amp, y: -amp * 0.4, duration: 0.04 },
      { x: -amp * 0.6, y: amp * 0.3, duration: 0.04 }, { x: amp * 0.4, y: 0, duration: 0.04 }, { x: 0, y: 0, duration: 0.05 }] }, t);

    tl.set("#cam", BASE, 0);
    // HOOK: hard punch on the number, release, bigger punch on "bloodbath" with a shake (crash scene tints red)
    punch({{at:w5}}, 1.22); punch({{at:w8}}, 1.1); punch({{at:w14}}, 1.28); shake({{at:w14}}, 26); punch({{at:w19}}, 1.12);
    punch({{at:w60}}, 1.06);
    // SPEND: stickers around her, then the whip-pan card arrives and she drops into a PIP (bottom-left)
    pipIn({{at:w73-0.04}}, -1);
    pipOut({{at:w77-0.06}});
    // WHY: whip zoom into her face on "why", second push on "need"
    tl.to("#cam", { scale: 1.32, duration: 0.18, ease: "power4.out" }, {{at:w78}});
    tl.to("#cam", { scale: 1.12, duration: 0.3, ease: "power3.out" }, {{at:w80}});
    tl.to("#cam", { scale: 1.36, duration: 0.16, ease: "power4.out" }, {{at:w84}});
    // RACE: split screen, she slides into the bottom half while the carousel owns the top half
    tl.to("#cam", { y: 330, scale: 1.0, duration: 0.4, ease: "expo.out" }, {{at:w89-0.04}});
    // CAKE: full-screen cake, she becomes a PIP (bottom-right); pull-back reveal on "Every single answer"
    pipIn({{at:w142-0.04}}, 1);
    pipOut({{at:w174-0.1}});
    // DEAL: full-screen skyline (she is hidden behind it, audio continues)
    tl.set("#cam", { scale: 1.08 }, {{at:w187}});
    // RUNS: back on her; punch on "none", the blackout covers her
    punch({{at:w205}}, 1.06); punch({{at:w221}}, 1.2);
    // PHASES: she sits right of frame so the kinetic list has room on the left
    tl.to("#cam", { x: 120, scale: 1.25, duration: 0.4, ease: "expo.out" }, {{at:w225-0.04}});
    tl.to("#cam", { x: 0, scale: 1.06, duration: 0.3, ease: "power3.out" }, {{at:w256-0.06}});
    // BATTLE: quick-cut burst (hard scale cuts every word), then the slam on "battle" with a shake
    punch({{at:w257}}, 1.18); punch({{at:w258}}, 1.0); punch({{at:w260}}, 1.24); punch({{at:w262}}, 1.04);
    punch({{at:w263}}, 1.3); punch({{at:w264}}, 1.1); punch({{at:w265}}, 1.34); shake({{at:w265}}, 22);
    punch({{at:w268}}, 1.06);
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
