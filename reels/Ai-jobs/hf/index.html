<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    {{fontfaces}}
    html, body { margin: 0; background: #000; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
    #cam { position: absolute; inset: 0; }
    #base { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <!-- Ai-jobs · "code review" look: deep indigo #17123A, electric lime #C6FF3D, coral #FF5A5F, lilac #8B7CFF, white.
       Four full-screen takeovers (job-drop stat, interview face-off, study counter, AI-code review) alternate with
       top-band beats (her head starts ~y 560, chin ~1220; captions below the chin). No camera moves (pipeline v3). -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="{{dur}}" data-width="1080" data-height="1920" data-fps="30">
    <div id="cam" style="z-index:1">
      <video id="base" src="assets/base.mp4" data-start="0" data-duration="{{dur}}" data-track-index="0" data-has-audio="true" playsinline></video>
    </div>
    <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="{{= at(w9) - 0.1 }}" data-track-index="1" data-track-kind="graphics" style="z-index:3"></div>
    <div id="drop" data-composition-id="drop" data-composition-src="compositions/drop.html" data-start="{{= at(w9) - 0.1 }}" data-duration="{{= at(w19) - at(w9) }}" data-track-index="2" data-track-kind="graphics" style="z-index:3"></div>
    <div id="voices" data-composition-id="voices" data-composition-src="compositions/voices.html" data-start="{{= at(w19) - 0.1 }}" data-duration="{{= at(w38) - at(w19) }}" data-track-index="3" data-track-kind="graphics" style="z-index:3"></div>
    <div id="study" data-composition-id="study" data-composition-src="compositions/study.html" data-start="{{= at(w38) - 0.1 }}" data-duration="{{= at(w70) - at(w38) }}" data-track-index="4" data-track-kind="graphics" style="z-index:3"></div>
    <div id="aicode" data-composition-id="aicode" data-composition-src="compositions/aicode.html" data-start="{{= at(w70) - 0.1 }}" data-duration="{{= at(w99) - at(w70) }}" data-track-index="5" data-track-kind="graphics" style="z-index:3"></div>
    <div id="move1" data-composition-id="move1" data-composition-src="compositions/move1.html" data-start="{{= at(w99) - 0.1 }}" data-duration="{{= at(w122) - at(w99) }}" data-track-index="6" data-track-kind="graphics" style="z-index:3"></div>
    <div id="move2" data-composition-id="move2" data-composition-src="compositions/move2.html" data-start="{{= at(w122) - 0.1 }}" data-duration="{{= at(w151) - at(w122) }}" data-track-index="7" data-track-kind="graphics" style="z-index:3"></div>
    <div id="move3" data-composition-id="move3" data-composition-src="compositions/move3.html" data-start="{{= at(w151) - 0.1 }}" data-duration="{{= at(w174) - at(w151) }}" data-track-index="8" data-track-kind="graphics" style="z-index:3"></div>
    <div id="own" data-composition-id="own" data-composition-src="compositions/own.html" data-start="{{= at(w174) - 0.1 }}" data-duration="{{= at(w207) - at(w174) }}" data-track-index="9" data-track-kind="graphics" style="z-index:3"></div>
    <div id="endc" data-composition-id="endc" data-composition-src="compositions/endc.html" data-start="{{= at(w207) - 0.1 }}" data-duration="{{= dur - at(w207) + 0.1 }}" data-track-index="10" data-track-kind="graphics" style="z-index:3"></div>
    <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="{{dur}}" data-track-index="11" data-track-kind="captions" style="z-index:5"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
