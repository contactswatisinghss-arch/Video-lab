<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Ground","default":"#12100E"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#FFF6E9"},
    {"id":"color-saffron","type":"color","label":"Saffron","default":"#FFB547"},
    {"id":"color-active","type":"color","label":"Active expert","default":"#2EE59D"},
    {"id":"color-idle","type":"color","label":"Idle expert","default":"#5B6577"}
  ]'>
<head>
  <meta charset="utf-8" />
  <style>
    {{fontfaces}}
    html, body { margin: 0; background: #000; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #12100E; }
    #cam { position: absolute; inset: 0; transform-origin: 50% 40%; }
    #base { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover;
      filter: brightness(1.08) contrast(1.03) saturate(.97); }
    /* light: neutral white balance (takes the yellow off the indoor bulbs) + a soft white key light on the face */
    #room-warm { position: absolute; inset: 0; pointer-events: none;
      background: rgba(170,200,255,.16); mix-blend-mode: soft-light; }
    #room-vig { position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(42% 24% at 50% 40%, rgba(255,255,255,.30) 0%, rgba(255,255,255,0) 100%); mix-blend-mode: soft-light; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      // Original cartoon chef in SVG. state: sleep | cook | boss. uid keeps gradient ids unique.
      window.chef = function chef(uid, skin, state, coat) {
        var ink = "#3B2F2A";
        var hat = '<path d="M22 42 C8 40 6 18 24 16 C26 2 46 -2 54 10 C62 -2 84 2 82 18 C98 20 96 42 80 42 Z" fill="#fff" stroke="' + ink + '" stroke-width="3"/>' +
          '<rect x="25" y="38" width="52" height="14" rx="4" fill="#fff" stroke="' + ink + '" stroke-width="3"/>';
        var face = '<circle cx="51" cy="74" r="27" fill="' + skin + '" stroke="' + ink + '" stroke-width="3"/>' +
          '<circle cx="36" cy="82" r="5" fill="#FF8FA3" opacity=".55"/><circle cx="66" cy="82" r="5" fill="#FF8FA3" opacity=".55"/>';
        var eyes, mouth, deco = "", glow = "", board = "";
        if (state === "sleep") {
          eyes = '<path d="M37 72 q5 5 10 0 M55 72 q5 5 10 0" stroke="' + ink + '" stroke-width="3" fill="none" stroke-linecap="round"/>';
          mouth = '<circle cx="51" cy="86" r="3" fill="' + ink + '"/>';
          deco = '<text x="80" y="40" font-family="Fredoka" font-weight="700" font-size="20" fill="#7C8BA1">z</text><text x="90" y="26" font-family="Fredoka" font-weight="700" font-size="14" fill="#7C8BA1">z</text>';
        } else {
          eyes = '<circle cx="42" cy="71" r="4" fill="' + ink + '"/><circle cx="60" cy="71" r="4" fill="' + ink + '"/><circle cx="43.5" cy="69.5" r="1.4" fill="#fff"/><circle cx="61.5" cy="69.5" r="1.4" fill="#fff"/>';
          mouth = '<path d="M41 83 q10 10 20 0" stroke="' + ink + '" stroke-width="3" fill="#C2414B" stroke-linecap="round"/>';
        }
        if (state === "cook") glow = '<circle cx="51" cy="74" r="50" fill="url(#' + uid + '-g)"/>' +
          '<path d="M10 30 l4 -10 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 z" fill="#FFC93C"/>' +
          '<path d="M88 60 l3 -7 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 z" fill="#FFC93C"/>';
        if (state === "boss") board = '<rect x="72" y="96" width="26" height="32" rx="3" fill="#C98A4B" stroke="' + ink + '" stroke-width="3"/><rect x="77" y="102" width="16" height="3" fill="#fff"/><rect x="77" y="109" width="16" height="3" fill="#fff"/><rect x="77" y="116" width="10" height="3" fill="#fff"/>';
        var body = '<path d="M24 128 C24 108 34 100 51 100 C68 100 78 108 78 128 Z" fill="' + (coat || "#fff") + '" stroke="' + ink + '" stroke-width="3"/>' +
          '<circle cx="51" cy="112" r="2.6" fill="' + ink + '"/><circle cx="51" cy="121" r="2.6" fill="' + ink + '"/>';
        return '<svg viewBox="-10 -10 120 145" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">' +
          '<defs><radialGradient id="' + uid + '-g"><stop offset="0" stop-color="#FFE27A" stop-opacity=".95"/><stop offset="1" stop-color="#FFE27A" stop-opacity="0"/></radialGradient></defs>' +
          glow + body + face + eyes + mouth + hat + deco + board + '</svg>';
      }
      window.SKINS = ["#F2C29B", "#C68863", "#8D5A3B", "#F5D3B3", "#B87A55", "#E8B48C", "#9B6545", "#F0C8A4"];
    })();
  </script>
</head>
<body>
  <!-- Mixture of Experts v3: storybook kitchen cards for the analogy + marker doodles and scrapbook paper on the wall for the explanation. -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="{{dur}}"
       data-width="1080" data-height="1920" data-fps="30">

    <div id="cam" style="z-index:1">
      <video id="base" src="assets/base.mp4" data-start="0" data-duration="{{dur}}" data-track-index="0" data-has-audio="true" playsinline></video>
    </div>
    <div id="room-warm" style="z-index:2"></div>
    <div id="room-vig" style="z-index:2"></div>

    <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
         data-start="0" data-duration="{{= at(w24) - 0.05 }}"
         data-track-index="1" data-track-kind="graphics" style="z-index:3"></div>

    <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
         data-start="{{= at(w24) - 0.05 }}" data-duration="{{= at(w41) - at(w24) - 0.05 }}"
         data-track-index="2" data-track-kind="graphics" style="z-index:3"></div>

    <div id="problem" data-composition-id="problem" data-composition-src="compositions/problem.html"
         data-start="{{= at(w41) - 0.1 }}" data-duration="{{= at(w64) - at(w41) }}"
         data-track-index="3" data-track-kind="graphics" style="z-index:3"></div>

    <div id="name" data-composition-id="name" data-composition-src="compositions/name.html"
         data-start="{{= at(w64) - 0.1 }}" data-duration="{{= at(w71) - at(w64) }}"
         data-track-index="4" data-track-kind="graphics" style="z-index:3"></div>

    <div id="kitchen" data-composition-id="kitchen" data-composition-src="compositions/kitchen.html"
         data-start="{{= at(w71) - 0.1 }}" data-duration="{{= at(w87) - at(w71) }}"
         data-track-index="5" data-track-kind="graphics" style="z-index:3"></div>

    <div id="inside" data-composition-id="inside" data-composition-src="compositions/inside.html"
         data-start="{{= at(w87) - 0.1 }}" data-duration="{{= at(w113) - at(w87) }}"
         data-track-index="6" data-track-kind="graphics" style="z-index:3"></div>

    <div id="tokens" data-composition-id="tokens" data-composition-src="compositions/tokens.html"
         data-start="{{= at(w113) - 0.1 }}" data-duration="{{= at(w132) - at(w113) }}"
         data-track-index="7" data-track-kind="graphics" style="z-index:3"></div>

    <div id="router" data-composition-id="router" data-composition-src="compositions/router.html"
         data-start="{{= at(w132) - 0.1 }}" data-duration="{{= at(w209) - at(w132) }}"
         data-track-index="8" data-track-kind="graphics" style="z-index:3"></div>

    <div id="example" data-composition-id="example" data-composition-src="compositions/example.html"
         data-start="{{= at(w209) - 0.1 }}" data-duration="{{= at(w230) - at(w209) }}"
         data-track-index="9" data-track-kind="graphics" style="z-index:3"></div>

    <div id="tradeoff" data-composition-id="tradeoff" data-composition-src="compositions/tradeoff.html"
         data-start="{{= at(w230) - 0.1 }}" data-duration="{{= at(w269) - at(w230) }}"
         data-track-index="10" data-track-kind="graphics" style="z-index:3"></div>

    <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
         data-start="{{= at(w269) - 0.1 }}" data-duration="{{= dur - at(w269) + 0.1 }}"
         data-track-index="11" data-track-kind="graphics" style="z-index:3"></div>

    <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
         data-start="0" data-duration="{{dur}}" data-track-index="12" data-track-kind="captions" style="z-index:5"></div>
  </div>

  <script>
    // Camera: punch-in on the hook, release on the explanation, punch on "eight", "only those two", "47", the payoff.
    const tl = gsap.timeline({ paused: true });
    tl.set("#cam", { scale: 1.12 }, 0)
      .set("#cam", { scale: 1.0 }, {{at:w14}})
      .set("#cam", { scale: 1.06 }, {{at:w49}})
      .set("#cam", { scale: 1.0 }, {{at:w64}})
      .set("#cam", { scale: 1.1 }, {{at:w75}})
      .set("#cam", { scale: 1.0 }, {{at:w87}})
      .set("#cam", { scale: 1.08 }, {{at:w154}})
      .set("#cam", { scale: 1.0 }, {{at:w162}})
      .set("#cam", { scale: 1.1 }, {{at:w218}})
      .set("#cam", { scale: 1.0 }, {{at:w230}})
      .set("#cam", { scale: 1.08 }, {{at:w269}});
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
