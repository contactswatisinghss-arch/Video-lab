<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    {{fontfaces}}
    html, body { margin: 0; background: #000; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0A0C11; }
    #cam { position: absolute; inset: 0; transform-origin: 50% 42%; }
    #base { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    /* room set dressing for this reel: an original warm neon "</>" sign on the wall to her right (static, no flicker) */
    #neon { position: absolute; left: 846px; top: 800px; font: 700 66px 'JetBrains Mono', monospace; color: #FFE7A3;
      text-shadow: 0 0 6px #FFD15C, 0 0 18px #F3BA2F, 0 0 42px rgba(243,186,47,.75); letter-spacing: -.04em; opacity: .9; }
    #floor { position: absolute; left: 0; bottom: 0; width: 1080px; height: 260px;
      background: linear-gradient(180deg, rgba(10,12,17,0), rgba(10,12,17,.85)); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <!-- Binance heist part 1. Look from the million-view refs: dark slate glass panels in the top band over her wall,
       Binance-yellow = money/system, red = attack/risk, green = valid/fix; numbers on screen, a beat every 2-3 s. -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="{{dur}}"
       data-width="1080" data-height="1920" data-fps="30">

    <div id="cam" style="z-index:1">
      <video id="base" src="assets/base.mp4" data-start="0" data-duration="{{dur}}" data-track-index="0" data-has-audio="true" playsinline></video>
      <div id="neon">&lt;/&gt;</div>
    </div>
    <div id="floor" style="z-index:2"></div>

    <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
         data-start="0" data-duration="{{= at(w48) - 0.04 }}" data-track-index="1" data-track-kind="graphics" style="z-index:3"></div>

    <div id="ledger" data-composition-id="ledger" data-composition-src="compositions/ledger.html"
         data-start="{{at:w48-0.04}}" data-duration="{{= at(w102) - at(w48) }}" data-track-index="2" data-track-kind="graphics" style="z-index:3"></div>

    <div id="exch" data-composition-id="exch" data-composition-src="compositions/exch.html"
         data-start="{{at:w102-0.04}}" data-duration="{{= at(w145) - at(w102) }}" data-track-index="3" data-track-kind="graphics" style="z-index:3"></div>

    <div id="step1" data-composition-id="step1" data-composition-src="compositions/step1.html"
         data-start="{{at:w145-0.04}}" data-duration="{{= at(w192) - at(w145) }}" data-track-index="4" data-track-kind="graphics" style="z-index:3"></div>

    <div id="step2" data-composition-id="step2" data-composition-src="compositions/step2.html"
         data-start="{{at:w192-0.04}}" data-duration="{{= at(w223) - at(w192) }}" data-track-index="5" data-track-kind="graphics" style="z-index:3"></div>

    <div id="step3" data-composition-id="step3" data-composition-src="compositions/step3.html"
         data-start="{{at:w223-0.04}}" data-duration="{{= at(w268) - at(w223) }}" data-track-index="6" data-track-kind="graphics" style="z-index:3"></div>

    <div id="total" data-composition-id="total" data-composition-src="compositions/total.html"
         data-start="{{at:w268-0.04}}" data-duration="{{= at(w285) - at(w268) }}" data-track-index="7" data-track-kind="graphics" style="z-index:3"></div>

    <div id="you" data-composition-id="you" data-composition-src="compositions/you.html"
         data-start="{{at:w285-0.04}}" data-duration="{{= at(w326) - at(w285) }}" data-track-index="8" data-track-kind="graphics" style="z-index:3"></div>

    <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
         data-start="{{at:w326-0.04}}" data-duration="{{= dur - at(w326) + 0.04 }}" data-track-index="9" data-track-kind="graphics" style="z-index:3"></div>

    <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
         data-start="0" data-duration="{{dur}}" data-track-index="10" data-track-kind="captions" style="z-index:5"></div>
  </div>

  <script>
    // Camera: lift her ~110 px so the wall above her head is free for graphics; hard punch-ins on the hook,
    // the questions and the turns, released whenever a dense graphic needs attention.
    const tl = gsap.timeline({ paused: true });
    tl.set("#cam", { y: -110, scale: 1.08 }, 0)
      .set("#cam", { scale: 1.0 }, {{at:w9}})
      .set("#cam", { scale: 1.10 }, {{at:w13}})
      .set("#cam", { scale: 1.0 }, {{at:w21}})
      .set("#cam", { scale: 1.06 }, {{at:w41}})
      .set("#cam", { scale: 1.14 }, {{at:w48}})
      .set("#cam", { scale: 1.0 }, {{at:w58}})
      .set("#cam", { scale: 1.08 }, {{at:w94}})
      .set("#cam", { scale: 1.0 }, {{at:w102}})
      .set("#cam", { scale: 1.08 }, {{at:w142}})
      .set("#cam", { scale: 1.0 }, {{at:w145}})
      .set("#cam", { scale: 1.10 }, {{at:w170}})
      .set("#cam", { scale: 1.0 }, {{at:w174}})
      .set("#cam", { scale: 1.08 }, {{at:w185}})
      .set("#cam", { scale: 1.0 }, {{at:w192}})
      .set("#cam", { scale: 1.10 }, {{at:w219}})
      .set("#cam", { scale: 1.0 }, {{at:w223}})
      .set("#cam", { scale: 1.08 }, {{at:w257}})
      .set("#cam", { scale: 1.0 }, {{at:w268}})
      .set("#cam", { scale: 1.12 }, {{at:w275}})
      .set("#cam", { scale: 1.0 }, {{at:w285}})
      .set("#cam", { scale: 1.08 }, {{at:w302}})
      .set("#cam", { scale: 1.0 }, {{at:w313}})
      .set("#cam", { scale: 1.12 }, {{at:w323}})
      .set("#cam", { scale: 1.0 }, {{at:w326}})
      .set("#cam", { scale: 1.10 }, {{at:w344}});
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
