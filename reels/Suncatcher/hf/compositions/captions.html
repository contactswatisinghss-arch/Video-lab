<template>
  <!-- Captions, LIGHTER test (style refs 01/04): sentence case, one short line, white with a soft shadow;
       key words get a gold (sun/space) or red (heat/cost) or green (fix) underline instead of a heavy block. -->
  <style>
    #cp-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    .cap-group { position: absolute; left: 0; width: 1080px; top: 1236px; text-align: center; overflow: visible; }
    .cap-line { display: inline-block; font-family: 'Inter', sans-serif; font-weight: 800; color: #FFFFFF; line-height: 1.08;
      letter-spacing: -.005em; text-shadow: 0 3px 14px rgba(0,0,0,.8), 0 1px 3px rgba(0,0,0,.8); padding: 0 60px; }
    .cap-word { display: inline-block; position: relative; transform-origin: 50% 80%; }
    .cap-word .cap-txt { position: relative; z-index: 1; }
    .cap-word.em-y::after, .cap-word.em-r::after, .cap-word.em-g::after { content: ""; position: absolute; left: 2px; right: 2px;
      bottom: -6px; height: 9px; border-radius: 5px; z-index: 0; }
    .cap-word.em-y .cap-txt { color: #FFD45E; }
    .cap-word.em-y::after { background: #FFC94A; }
    .cap-word.em-r .cap-txt { color: #FF8A73; }
    .cap-word.em-r::after { background: #FF5A45; }
    .cap-word.em-g .cap-txt { color: #4BEFA6; }
    .cap-word.em-g::after { background: #35E39A; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
    <div id="cp-stage"></div>
  </div>
  <script>
    {{lib:captions}}
    (function () {
      const tl = gsap.timeline({ paused: true });
      const words = {{words}};
      HFCaps.build({
        tl, container: "#cp-stage", words, idPrefix: "cp",
        maxWords: 4, maxChars: 24, pauseBreak: 0.24, hold: 0.3,
        emphasis: { "em-y": ["space.", "space,", "space?", "space", "orbit,", "orbiting", "sunlight", "Suncatcher,", "Gemma", "clock.", "AI."],
                    "em-r": ["power.", "water", "electricity", "100,000", "heat", "heated.", "radiation,", "challenge,", "no"],
                    "em-g": ["answered", "answering.", "tracking", "progress,"] },
        font: { family: "Inter", weight: 800, size: 66, min: 48, maxWidth: 960 },
        word(tl, span, w, grp, i) {
          tl.fromTo(span, { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.12, ease: "power2.out" }, Math.max(grp.start, w.start - 0.04));
        },
        exit(tl, g, grp) { tl.to(g, { opacity: 0, duration: 0.08, ease: "power2.in" }, grp.end - 0.08); },
      });
      window.__timelines["captions"] = tl;
    })();
  </script>
</template>
